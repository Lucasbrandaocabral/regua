name: APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Uma execução por vez, para duas pushes seguidas não brigarem pela mesma release.
concurrency:
  group: apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e APK
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk regua.apk

      - uses: actions/upload-artifact@v4
        with:
          name: regua-apk
          path: regua.apk

      # Mantém sempre o APK mais novo no mesmo link:
      # https://github.com/<dono>/<repo>/releases/download/apk/regua.apk
      - name: Publicar na release "apk"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk regua.apk \
            --target "$GITHUB_SHA" \
            --title "Régua (última versão)" \
            --notes "APK gerado automaticamente a partir de $GITHUB_REF_NAME ($GITHUB_SHA). Baixe regua.apk no celular e instale."
